# Base definition shared by VS Code and start.sh. It deliberately mounts nothing
# from the host but this checkout: no ~/.ssh, no ~/.claude, no home directory.
# The parts of the checkout the host executes are mounted read-only on top, so
# a prompt-injected command in here can't plant code that later runs out there.
# start.sh layers compose.ssh.yml (agent forwarding) and, with --docker,
# compose.docker.yml (privileged nested Docker) on top of it.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - ..:/workspace:cached
      # start.sh and the compose files run on the host.
      - ../.devcontainer:/workspace/.devcontainer:ro
      # Host git runs hooks from here, and commands named in .git/config
      # (core.fsmonitor, core.sshCommand, aliases, filters...). The container's
      # own hooks come from the image; see core.hooksPath in the Dockerfile.
      - ../.git/hooks:/workspace/.git/hooks:ro
      - ../.git/config:/workspace/.git/config:ro
      - claude-config:/home/vscode/.claude
    environment:
      # Pass-through from the calling environment, never written to a file here.
      # gh reads either; a fine-grained token scoped to this repo is enough.
      - GH_TOKEN
      - GITHUB_TOKEN
# __PROJECT_SERVICES__

volumes:
  # A fixed name, so the Claude login is shared by every container for this
  # repo — VS Code's and start.sh's, across checkouts and rebuilds.
  claude-config:
    name: __PROJECT__-claude-config

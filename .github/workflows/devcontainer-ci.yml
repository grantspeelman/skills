name: devcontainer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: grantspeelman-skills-devcontainer:ci
      CST_VERSION: v1.22.1
      CST_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate compose files
        run: |
          ports_dir="$(mktemp -d)"
          for workspace in clone mount; do
            compose=(docker compose
              -f .devcontainer/docker-compose.yml
              -f ".devcontainer/compose.$workspace.yml"
              -f .devcontainer/compose.docker.yml)
            "${compose[@]}" config --quiet
            # compose.ports.yml as start.sh has ports.sh write it, with no
            # ports and with one, checked the way start.sh checks it.
            for ports in "" 3000; do
              file="$ports_dir/$workspace${ports:+-$ports}.yml"
              .devcontainer/ports.sh write "$file" $ports
              .devcontainer/ports.sh check "$file" "${compose[@]}"
            done
            # A port on every interface is refused (exit 2), also when a
            # value spells out a loopback host_ip.
            printf 'services:\n  app:\n    ports: ["3000:3000"]\n' > "$ports_dir/open.yml"
            printf '%s\n' 'services:' '  app:' '    ports:' '      - target: 3000' \
              '        published: "3000"' '        name: |' '          host_ip: 127.0.0.1' \
              > "$ports_dir/open-name.yml"
            for open in open open-name; do
              status=0
              .devcontainer/ports.sh check "$ports_dir/$open.yml" "${compose[@]}" || status=$?
              [ "$status" = 2 ]
            done
          done
          grep -qx '      - "127.0.0.1:[0-9]*:3000"' "$ports_dir/clone-3000.yml"

      - name: Build image
        run: docker build -f .devcontainer/Dockerfile -t "$IMAGE" .

      - name: Install container-structure-test
        run: |
          curl -fsSL --retry 5 -o /usr/local/bin/container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-amd64"
          echo "${CST_SHA256}  /usr/local/bin/container-structure-test" | sha256sum -c -
          chmod +x /usr/local/bin/container-structure-test

      - name: Structure test
        run: container-structure-test test --image "$IMAGE" --config .devcontainer/container-structure-test.yaml

      # Backstop for commits made outside the container, where the lefthook
      # pre-commit hook does not run.
      - name: Secret scan (full history)
        run: |
          # Run as the checkout's owner, or git rejects the repo as "dubious ownership".
          docker run --rm --entrypoint gitleaks --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$IMAGE" \
            git --redact --no-banner --verbose .

  # Runs start.sh from a throwaway checkout and checks it behaves: the seeded
  # clone, --reset, --mount-workspace, compose.ports.yml, no SSH agent, git
  # over HTTPS with GH_TOKEN, Claude settings, skills link, commit hook,
  # nested Docker and dropping back to unprivileged. The runner's UID (1001)
  # also exercises the image's UID remapping, which the default 1000 build
  # above does not.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test
        run: .devcontainer/smoke-test.sh

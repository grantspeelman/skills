# Base definition shared by VS Code and start.sh. It mounts nothing from the
# host: no checkout, no ~/.ssh, no ~/.claude, no home directory. Where /workspace
# comes from is up to the overlay on top:
#   compose.clone.yml  start.sh's default: the container's own clone, in a volume
#   compose.mount.yml  start.sh --mount-workspace and VS Code: the host checkout
# No ssh-agent is forwarded: git reaches GitHub over HTTPS with GH_TOKEN. With
# --docker, start.sh layers compose.docker.yml (privileged nested Docker) on top.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    # GH_TOKEN=... for git push and gh, from a host file outside the checkout,
    # where the container can't read or change it. It's the container's only
    # GitHub credential: a fine-grained token scoped to this repo, with no
    # Administration permission (see the README). No `environment:` pass-through on purpose: an unset
    # pass-through overrides the file with nothing.
    env_file:
      - path: ${HOME}/.config/grantspeelman/skills/gh.env
        required: false
